<!-- @dsCard group="Colors" viewport="700x150" name="Ink & text" subtitle="Heading ink, forest ink, body and mute" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--color-canvas)}.sw{display:flex;gap:var(--space-md);flex-wrap:nowrap}.chip{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--space-sm)}.chip .fill{height:56px;border-radius:var(--radius-md)}.chip .n{font:var(--type-body-sm-strong);color:var(--color-ink)}.chip .h{font:var(--type-caption);color:var(--color-mute);font-variant-numeric:tabular-nums}.lbl{font:var(--type-eyebrow);letter-spacing:var(--letter-spacing-eyebrow);text-transform:uppercase;color:var(--color-mute)}</style>
</head><body>
<div class="sw"><div class="chip"><div class="fill" style="background:var(--color-ink)"></div><span class="n">--color-ink</span><span class="h">#111827</span></div><div class="chip"><div class="fill" style="background:var(--color-ink-deep)"></div><span class="n">--color-ink-deep</span><span class="h">#14532d</span></div><div class="chip"><div class="fill" style="background:var(--color-body)"></div><span class="n">--color-body</span><span class="h">#374151</span></div><div class="chip"><div class="fill" style="background:var(--color-mute)"></div><span class="n">--color-mute</span><span class="h">#6b7280</span></div></div>
</body></html>
