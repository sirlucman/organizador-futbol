<!-- @dsCard group="Colors" viewport="700x150" name="Negative" subtitle="Destructive red family through to the maroon callout ground" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--color-canvas)}.sw{display:flex;gap:var(--space-md);flex-wrap:nowrap}.chip{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--space-sm)}.chip .fill{height:56px;border-radius:var(--radius-md)}.chip .n{font:var(--type-body-sm-strong);color:var(--color-ink)}.chip .h{font:var(--type-caption);color:var(--color-mute);font-variant-numeric:tabular-nums}.lbl{font:var(--type-eyebrow);letter-spacing:var(--letter-spacing-eyebrow);text-transform:uppercase;color:var(--color-mute)}</style>
</head><body>
<div class="sw"><div class="chip"><div class="fill" style="background:var(--color-negative)"></div><span class="n">--color-negative</span><span class="h">#ef4444</span></div><div class="chip"><div class="fill" style="background:var(--color-negative-deep)"></div><span class="n">--color-negative-deep</span><span class="h">#dc2626</span></div><div class="chip"><div class="fill" style="background:var(--color-negative-darkest)"></div><span class="n">--color-negative-darkest</span><span class="h">#b91c1c</span></div><div class="chip"><div class="fill" style="background:var(--color-negative-bg)"></div><span class="n">--color-negative-bg</span><span class="h">#450a0a</span></div></div>
</body></html>
