<!-- @dsCard group="Colors" viewport="700x200" name="Surface contrast in use" subtitle="White, sage, pale-green and ink cards — the system's only elevation cue" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--color-canvas)}.sw{display:flex;gap:var(--space-md);flex-wrap:nowrap}.chip{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--space-sm)}.chip .fill{height:56px;border-radius:var(--radius-md)}.chip .n{font:var(--type-body-sm-strong);color:var(--color-ink)}.chip .h{font:var(--type-caption);color:var(--color-mute);font-variant-numeric:tabular-nums}.lbl{font:var(--type-eyebrow);letter-spacing:var(--letter-spacing-eyebrow);text-transform:uppercase;color:var(--color-mute)}body{background:var(--color-canvas-soft);padding:20px}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-md)}.c{border-radius:var(--radius-card);padding:var(--space-lg);min-height:120px;display:flex;flex-direction:column;justify-content:space-between}.t{font:var(--type-body-md-strong)}.s{font:var(--type-caption)}</style>
</head><body>
<div class="g"><div class="c" style="background:var(--color-canvas);color:var(--color-ink)"><span class="t">Content</span><span class="s" style="color:var(--color-mute)">canvas on sage</span></div><div class="c" style="background:var(--color-canvas-soft);color:var(--color-ink);box-shadow:inset 0 0 0 1px var(--color-canvas)"><span class="t">Sage</span><span class="s" style="color:var(--color-mute)">feature fill</span></div><div class="c" style="background:var(--color-primary-pale);color:var(--color-ink)"><span class="t">Green</span><span class="s" style="color:var(--color-ink-deep)">pale tint</span></div><div class="c" style="background:var(--color-ink);color:var(--color-primary)"><span class="t">Dark</span><span class="s" style="color:var(--color-primary-neutral)">polarity flip</span></div></div>
</body></html>
