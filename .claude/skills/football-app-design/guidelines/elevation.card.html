<!-- @dsCard group="Brand" viewport="700x190" name="Elevation" subtitle="Flat by default · 1px ink hairline · surface contrast · derived overlay shadows" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--color-canvas)}.sw{display:flex;gap:var(--space-md);flex-wrap:nowrap}.chip{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--space-sm)}.chip .fill{height:56px;border-radius:var(--radius-md)}.chip .n{font:var(--type-body-sm-strong);color:var(--color-ink)}.chip .h{font:var(--type-caption);color:var(--color-mute);font-variant-numeric:tabular-nums}.lbl{font:var(--type-eyebrow);letter-spacing:var(--letter-spacing-eyebrow);text-transform:uppercase;color:var(--color-mute)}body{background:var(--color-canvas-soft);padding:20px}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-md)}.c{background:var(--color-canvas);border-radius:var(--radius-card);padding:var(--space-lg);min-height:110px;display:flex;flex-direction:column;justify-content:space-between}.n{font:var(--type-body-sm-strong)}.t{font:var(--type-caption);color:var(--color-mute)}</style>
</head><body>
<div class="g"><div class="c"><span class="n">Level 0</span><span class="t">flat — no border, no shadow</span></div><div class="c" style="box-shadow:var(--elevation-hairline)"><span class="n">Level 1</span><span class="t">1px ink hairline</span></div><div class="c"><span class="n">Level 2</span><span class="t">white on sage — contrast is the lift</span></div><div class="c" style="box-shadow:var(--shadow-overlay)"><span class="n">Overlay</span><span class="t">derived — modals only</span></div></div>
</body></html>
