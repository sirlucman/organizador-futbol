<!-- @dsCard group="Brand" viewport="700x180" name="Interaction states" subtitle="Hover lightens, press scales 0.98, focus rings ink — no bounce anywhere" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--color-canvas)}.sw{display:flex;gap:var(--space-md);flex-wrap:nowrap}.chip{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--space-sm)}.chip .fill{height:56px;border-radius:var(--radius-md)}.chip .n{font:var(--type-body-sm-strong);color:var(--color-ink)}.chip .h{font:var(--type-caption);color:var(--color-mute);font-variant-numeric:tabular-nums}.lbl{font:var(--type-eyebrow);letter-spacing:var(--letter-spacing-eyebrow);text-transform:uppercase;color:var(--color-mute)}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-md)}.col{display:flex;flex-direction:column;gap:var(--space-sm)}.pill{padding:var(--space-md) var(--space-xl);border-radius:var(--radius-button);font:var(--type-button-md);text-align:center;background:var(--color-primary);color:var(--color-on-primary)}</style>
</head><body>
<div class="g"><div class="col"><span class="lbl">rest</span><div class="pill">Create</div></div><div class="col"><span class="lbl">hover</span><div class="pill" style="background:var(--color-primary-active)">Create</div></div><div class="col"><span class="lbl">press</span><div class="pill" style="background:var(--color-primary-active);transform:scale(.98)">Create</div></div><div class="col"><span class="lbl">focus</span><div class="pill" style="outline:2px solid var(--color-ink);outline-offset:2px">Create</div></div></div><p style="font:var(--type-caption);color:var(--color-mute);margin-top:var(--space-lg)">140ms · cubic-bezier(0.22, 0.61, 0.36, 1) · colour and opacity only</p>
</body></html>
