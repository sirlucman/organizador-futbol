<!-- @dsCard group="Shape" viewport="700x170" name="Radius scale" subtitle="0 · 8 · 12 · 16 · 24 · 9999 — 24px is canonical" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--color-canvas)}.sw{display:flex;gap:var(--space-md);flex-wrap:nowrap}.chip{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--space-sm)}.chip .fill{height:56px;border-radius:var(--radius-md)}.chip .n{font:var(--type-body-sm-strong);color:var(--color-ink)}.chip .h{font:var(--type-caption);color:var(--color-mute);font-variant-numeric:tabular-nums}.lbl{font:var(--type-eyebrow);letter-spacing:var(--letter-spacing-eyebrow);text-transform:uppercase;color:var(--color-mute)}.g{display:flex;gap:var(--space-md)}.b{flex:1;display:flex;flex-direction:column;gap:var(--space-sm);align-items:center}.b .sq{width:100%;height:64px;background:var(--color-primary-pale);box-shadow:inset 0 0 0 1px var(--color-primary-neutral)}.b .n{font:var(--type-body-sm-strong)}.b .t{font:var(--type-caption);color:var(--color-mute)}</style>
</head><body>
<div class="g"><div class="b"><div class="sq" style="border-radius:0px"></div><span class="n">0px</span><span class="t">none</span></div><div class="b"><div class="sq" style="border-radius:8px"></div><span class="n">8px</span><span class="t">sm</span></div><div class="b"><div class="sq" style="border-radius:12px"></div><span class="n">12px</span><span class="t">md</span></div><div class="b"><div class="sq" style="border-radius:16px"></div><span class="n">16px</span><span class="t">lg</span></div><div class="b"><div class="sq" style="border-radius:24px"></div><span class="n">24px</span><span class="t">xl</span></div><div class="b"><div class="sq" style="border-radius:9999px"></div><span class="n">9999px</span><span class="t">pill</span></div></div>
</body></html>
