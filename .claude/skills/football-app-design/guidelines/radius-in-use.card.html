<!-- @dsCard group="Shape" viewport="700x160" name="Radius in use" subtitle="24px buttons and cards, 12px inputs, pill badges, full-round icon buttons" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--color-canvas)}.sw{display:flex;gap:var(--space-md);flex-wrap:nowrap}.chip{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--space-sm)}.chip .fill{height:56px;border-radius:var(--radius-md)}.chip .n{font:var(--type-body-sm-strong);color:var(--color-ink)}.chip .h{font:var(--type-caption);color:var(--color-mute);font-variant-numeric:tabular-nums}.lbl{font:var(--type-eyebrow);letter-spacing:var(--letter-spacing-eyebrow);text-transform:uppercase;color:var(--color-mute)}.row{display:flex;align-items:center;gap:var(--space-md);flex-wrap:wrap}.pill{padding:var(--space-md) var(--space-xl);border-radius:var(--radius-button);background:var(--color-primary);color:var(--color-on-primary);font:var(--type-button-md)}.inp{padding:var(--space-md) var(--space-lg);border-radius:var(--radius-input);border:1px solid var(--color-ink);font:var(--type-body-md);color:var(--color-mute);background:var(--color-canvas)}.bdg{padding:var(--space-xs) var(--space-md);border-radius:var(--radius-badge);background:var(--color-primary-pale);color:var(--color-positive-deep);font:var(--type-body-sm-strong)}.ib{width:40px;height:40px;border-radius:var(--radius-full);background:var(--color-canvas-soft);display:grid;place-items:center;font:var(--type-body-sm-strong)}.crd{border-radius:var(--radius-card);background:var(--color-canvas-soft);padding:var(--space-lg);font:var(--type-body-sm);color:var(--color-body)}</style>
</head><body>
<div style="display:flex;flex-direction:column;gap:var(--space-md)"><div class="row"><span class="pill">24px button</span><span class="inp">12px input</span><span class="bdg">pill badge</span><span class="ib">·</span></div><div class="crd">24px card — the canonical radius, used for every surface.</div></div>
</body></html>
