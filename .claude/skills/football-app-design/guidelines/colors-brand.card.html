<!-- @dsCard group="Colors" viewport="700x190" name="Football green" subtitle="Pitch-derived green ramp — turf shadow through to the bright centre stripe" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--color-canvas)}.sw{display:flex;gap:var(--space-sm)}.chip{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--space-sm)}.chip .fill{height:56px;border-radius:var(--radius-md)}.chip .n{font:var(--type-body-sm-strong);color:var(--color-ink)}.chip .h{font:var(--type-caption);color:var(--color-mute);font-variant-numeric:tabular-nums}.roles{display:flex;flex-wrap:wrap;gap:var(--space-lg);margin-top:var(--space-md);font:var(--type-caption);color:var(--color-mute)}.roles b{color:var(--color-ink);font-weight:600}</style>
</head><body>
<div class="sw">
<div class="chip"><div class="fill" style="background:var(--green-900)"></div><span class="n">900</span><span class="h">#2a5d0a</span></div>
<div class="chip"><div class="fill" style="background:var(--green-700)"></div><span class="n">700</span><span class="h">#417513</span></div>
<div class="chip"><div class="fill" style="background:var(--green-600)"></div><span class="n">600</span><span class="h">#609023</span></div>
<div class="chip"><div class="fill" style="background:var(--green-500)"></div><span class="n">500</span><span class="h">#85b632</span></div>
<div class="chip"><div class="fill" style="background:var(--green-400)"></div><span class="n">400</span><span class="h">#a4cf49</span></div>
<div class="chip"><div class="fill" style="background:var(--green-300)"></div><span class="n">300</span><span class="h">#c3e07c</span></div>
<div class="chip"><div class="fill" style="background:var(--green-100)"></div><span class="n">100</span><span class="h">#e4f0c4</span></div>
</div>
<div class="roles"><span><b>500</b> primary CTA</span><span><b>400</b> hover / active</span><span><b>300</b> neutral fill</span><span><b>100</b> pale surface</span><span><b>600–900</b> turf shadow, deep ink greens</span></div>
</body></html>
