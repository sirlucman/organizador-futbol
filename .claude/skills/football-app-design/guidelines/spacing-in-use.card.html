<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--color-canvas)}.sw{display:flex;gap:var(--space-md);flex-wrap:nowrap}.chip{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--space-sm)}.chip .fill{height:56px;border-radius:var(--radius-md)}.chip .n{font:var(--type-body-sm-strong);color:var(--color-ink)}.chip .h{font:var(--type-caption);color:var(--color-mute);font-variant-numeric:tabular-nums}.lbl{font:var(--type-eyebrow);letter-spacing:var(--letter-spacing-eyebrow);text-transform:uppercase;color:var(--color-mute)}body{background:var(--color-canvas-soft);padding:20px}.band{background:var(--color-canvas);border-radius:var(--radius-lg);padding:var(--space-3xl) var(--space-xl);position:relative}.card{background:var(--color-canvas-soft);border-radius:var(--radius-card);padding:var(--space-xl);display:flex;flex-direction:column;gap:var(--space-md)}.tag{position:absolute;top:var(--space-sm);left:var(--space-sm);font:var(--type-caption);color:var(--color-mute)}.pill{align-self:flex-start;padding:var(--space-md) var(--space-xl);border-radius:var(--radius-button);background:var(--color-primary);color:var(--color-on-primary);font:var(--type-button-md)}</style>
</head><body>
<div class="band"><span class="tag">band · 48px / 24px</span><div class="card"><span class="lbl">card · 24px interior</span><span style="font:var(--type-body-md);color:var(--color-body)">Gaps inside a card step 8 → 12 → 16.</span><span class="pill">12px / 24px</span></div></div>
</body></html>
