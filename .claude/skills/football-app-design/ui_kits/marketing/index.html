<!-- @dsCard group="Marketing site" viewport="1200x820" name="Landing page" subtitle="Sage hero with the match planner, feature bands, squad balance, dark CTA" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Football App — marketing site</title><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;background:var(--color-canvas)}#toasts{position:fixed;right:var(--space-xl);bottom:var(--space-xl);display:flex;flex-direction:column;gap:var(--space-md);z-index:80}#root{position:relative;min-height:100vh}</style>
</head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" data-presets="react" src="MarketingShell.jsx"></script>
<script type="text/babel" data-presets="react" src="LandingPage.jsx"></script>
<script type="text/babel" data-presets="react" src="PricingPage.jsx"></script>
<script type="text/babel" data-presets="react" src="SignInPage.jsx"></script>
<script type="text/babel" data-presets="react">
const { Modal, Toast, TextInput, Button, Icon } = window.FootballAppDesignSystem_49d016;
function Site(){
  const [page,setPage]=React.useState('landing');
  const [modal,setModal]=React.useState(false);
  const [toast,setToast]=React.useState(null);
  const [team,setTeam]=React.useState('');
  const notify=(t)=>{setToast(t);window.clearTimeout(window.__t);window.__t=window.setTimeout(()=>setToast(null),4200);};
  const pages={
    landing:<LandingPage onCta={()=>setModal(true)} onPlan={sel=>notify({tone:'positive',title:'Match planned',message:sel.home+' vs '+sel.away+' — '+sel.formation+'.'})}/>,
    pricing:<PricingPage onCta={()=>setModal(true)}/>,
    signin:<SignInPage onSignedIn={email=>notify({tone:'positive',title:'Signed in',message:'Welcome back, '+email+'.'})}/>,
  };
  return (
  <>
    <MarketingShell page={page} setPage={setPage} onCta={()=>setModal(true)}>{pages[page]}</MarketingShell>
    <Modal open={modal} title="Create your team" description="Name the squad. You can invite players and set a formation next."
      onClose={()=>setModal(false)} style={{position:'fixed'}}
      actions={<><Button variant="tertiary" onClick={()=>setModal(false)}>Cancel</Button>
        <Button variant="primary" onClick={()=>{setModal(false);notify({tone:'positive',title:'Team created',message:(team||'Riverside FC')+' is ready for players.'});}}>Create team</Button></>}>
      <TextInput label="Team name" placeholder="e.g. Riverside FC" value={team} onChange={e=>setTeam(e.target.value)}/>
      <TextInput label="Season" value="2026/27" hint="Change this later in settings."/>
    </Modal>
    {toast?<div id="toasts"><Toast tone={toast.tone} icon={<Icon name="check" size={18} color="var(--color-positive)"/>} title={toast.title} message={toast.message} onDismiss={()=>setToast(null)}/></div>:null}
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Site/>);
</script></body></html>
