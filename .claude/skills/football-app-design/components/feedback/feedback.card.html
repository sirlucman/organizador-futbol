<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Feedback</title><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-page)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-xl);align-items:start}.toasts{display:flex;flex-direction:column;gap:var(--space-md)}.stage{position:relative;height:320px;border-radius:var(--radius-card);background:var(--color-canvas);overflow:hidden}</style>
</head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Toast, EmptyState, Modal, Button, Icon } = window.FootballAppDesignSystem_49d016;
function Demo(){return (
<div className="grid">
  <div className="toasts">
    <Toast tone="positive" icon={<Icon name="check" size={18} color="var(--color-positive)"/>} title="Lineup saved" message="Riverside FC vs Northgate United — 4-3-3." onDismiss={()=>{}}/>
    <Toast tone="warning" icon={<Icon name="alert-triangle" size={18} color="var(--color-warning-deep)"/>} title="Two players unavailable" message="Check the squad before Saturday." onDismiss={()=>{}}/>
    <Toast tone="negative" icon={<Icon name="x" size={18} color="var(--color-negative)"/>} title="Invite failed" message="That email is already registered." onDismiss={()=>{}}/>
    <EmptyState media={<Icon name="users" size={26}/>} title="No players yet" caption="Add your first player or import a squad sheet."
      action={<Button variant="primary">Add player</Button>} style={{padding:'var(--space-xl)'}}/>
  </div>
  <div className="stage">
    <Modal open title="Release player?" description="A. Ferreira will be removed from the squad for the rest of the season."
      onClose={()=>{}} width={340}
      actions={<><Button variant="tertiary">Cancel</Button><Button variant="primary">Release</Button></>}/>
  </div>
</div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
