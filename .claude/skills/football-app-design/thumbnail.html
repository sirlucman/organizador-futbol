<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Football App Design System</title><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;padding:0}.tile{width:1280px;height:854px;display:grid;grid-template-columns:1fr 232px}.main{background:var(--color-primary);display:grid;place-items:center;padding:0 56px}.mark{font-family:var(--font-display);font-weight:900;font-size:150px;line-height:0.92;letter-spacing:-0.03em;color:var(--color-on-primary);text-align:center;white-space:nowrap}.strip{display:grid;grid-template-rows:repeat(4,1fr)}</style>
</head><body>
<div class="tile">
<div class="main"><div class="mark">Football<br>App</div></div>
<div class="strip"><div style="background:var(--color-warning)"></div><div style="background:var(--color-accent-cyan)"></div><div style="background:var(--color-accent-orange)"></div><div style="background:var(--color-negative)"></div></div>
</div>
</body></html>
