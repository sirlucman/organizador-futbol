<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sincronizar datos: producción → staging</title>
<style>
  body{ font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; color:#222; }
  h1{ font-size: 20px; }
  p{ line-height: 1.5; }
  button{ font-size: 16px; padding: 10px 18px; cursor: pointer; }
  button:disabled{ cursor: not-allowed; opacity: 0.6; }
  #log{ margin-top: 20px; background:#f4f4f4; border-radius: 6px; padding: 12px; font-family: monospace; font-size: 13px; white-space: pre-wrap; min-height: 80px; }
  .warn{ background:#fff3cd; border:1px solid #ffe69c; border-radius: 6px; padding: 12px; margin: 16px 0; }
</style>
</head>
<body>
<h1>Sincronizar datos: producción → staging</h1>
<div class="warn">
  Esto <strong>lee</strong> los datos de la base real (<code>organizador-futbol</code>) y
  <strong>sobrescribe</strong> los datos de la base de prueba (<code>organizador-futbol-staging</code>).
  Nunca escribe en producción. Usalo antes de probar algo nuevo, para tener datos realistas en staging.
</div>
<button id="btnSync">Copiar datos de producción a staging</button>
<div id="log">Esperando...</div>

<script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore-compat.js"></script>
<script>
  const prodConfig = {
    apiKey: "AIzaSyCL8i-_EjkbVUehawTgj4TTM6szn5cFobg",
    authDomain: "organizador-futbol.firebaseapp.com",
    projectId: "organizador-futbol",
    storageBucket: "organizador-futbol.firebasestorage.app",
    messagingSenderId: "603962428156",
    appId: "1:603962428156:web:d782f91842a696f0b2a579"
  };
  const stagingConfig = {
    apiKey: "AIzaSyD43vH2kraPrPyU3YyhoZl-1H0oNzOTNUc",
    authDomain: "organizador-futbol-staging.firebaseapp.com",
    projectId: "organizador-futbol-staging",
    storageBucket: "organizador-futbol-staging.firebasestorage.app",
    messagingSenderId: "297847145657",
    appId: "1:297847145657:web:363aec7820815e456ec768"
  };

  const prodApp = firebase.initializeApp(prodConfig, 'prod');
  const stagingApp = firebase.initializeApp(stagingConfig, 'staging');
  const prodDb = prodApp.firestore();
  const stagingDb = stagingApp.firestore();

  const DOC_IDS = ['players', 'partidos', 'motorConfig'];
  const logEl = document.getElementById('log');
  const btn = document.getElementById('btnSync');

  function log(msg){ logEl.textContent += '\n' + msg; }

  btn.addEventListener('click', async () => {
    const confirmed = confirm('¿Confirmás? Esto va a sobrescribir los datos actuales de STAGING con una copia de los de producción.');
    if(!confirmed) return;

    btn.disabled = true;
    logEl.textContent = 'Copiando...';

    for(const id of DOC_IDS){
      try{
        const doc = await prodDb.collection('data').doc(id).get();
        if(!doc.exists){
          log(`- "${id}": no existe en producción, se omite.`);
          continue;
        }
        await stagingDb.collection('data').doc(id).set(doc.data());
        log(`- "${id}": copiado OK.`);
      }catch(e){
        log(`- "${id}": ERROR (${e.message})`);
      }
    }

    log('\nListo. Ya podés probar localmente con estos datos.');
    btn.disabled = false;
  });
</script>
</body>
</html>
